services:
  backend:
    build: .
    container_name: backend
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      OLLAMA_URL: http://ollama:11434
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data: